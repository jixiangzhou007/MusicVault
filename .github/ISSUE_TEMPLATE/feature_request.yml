name: 💡 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 你希望 MusicVault 增加什么功能？
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 这个功能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）
    validations:
      required: false
